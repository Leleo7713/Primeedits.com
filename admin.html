<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel | Prime Edits</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0A1112;--p2:#0E1819;--line:#16302A;--ink:#EAF5F0;--muted:#8FA59D;--g:#1FE58E;--y:#FFD21F;--red:#ff6b6b;--f:"Manrope","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 .95rem/1.5 var(--f);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;cursor:pointer}
.wrap{width:min(1000px,100% - 2rem);margin:0 auto}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(0,0,0,.92);z-index:5}
.bar{display:flex;align-items:center;gap:1rem;height:60px}
.bar b{color:var(--g);font-size:1.1rem;flex:1}.bar small{color:var(--muted)}
.btn{background:var(--g);color:#04140C;border:0;border-radius:8px;padding:.5rem .95rem;font-weight:700}
.btn.d{background:var(--p2);color:var(--ink);border:1px solid var(--line)}
.btn.r{background:#2a1010;color:var(--red);border:1px solid #5a2a2a}
.btn.s{padding:.3rem .7rem;font-size:.82rem}
.btn:disabled{opacity:.5}
nav{display:flex;gap:.4rem;margin:1.2rem 0;flex-wrap:wrap}
nav button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:.5rem 1.1rem;font-weight:600}
nav button.on{background:var(--g);color:#04140C;border-color:var(--g)}
nav i{font-style:normal;background:var(--y);color:#1a1400;border-radius:99px;padding:0 .45rem;margin-left:.4rem;font-size:.75rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.2rem}
.st{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem}
.st small{color:var(--muted);display:block}.st b{font-size:1.35rem;color:var(--y)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:.8rem}
.row{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:.82rem}
.tag{border-radius:99px;padding:.1rem .65rem;font-size:.78rem;font-weight:600}
.pending{background:rgba(255,210,31,.15);color:var(--y)}.paid{background:rgba(31,229,142,.14);color:var(--g)}.rejected{background:rgba(255,90,90,.15);color:var(--red)}
.it{display:flex;justify-content:space-between;padding:.15rem 0}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.7rem}
input,textarea,select{width:100%;margin-top:.25rem;background:var(--p2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:.6rem .75rem;font:inherit}
input:focus,textarea:focus{border-color:var(--g);outline:0}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:.7rem}
.chk{display:flex;gap:.5rem;align-items:center}.chk input{width:auto;margin:0}
.msg{min-height:1.2em;font-size:.85rem;color:var(--g)}.msg.e{color:var(--red)}
.stars{color:#FFB400}
#login{min-height:100vh;display:grid;place-items:center;padding:1rem}
.box{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.6rem}
.box h1{margin:0 0 .3rem;color:var(--g);font-size:1.3rem}
[hidden]{display:none!important}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="cfg" hidden class="box" style="margin:3rem auto"><h1>Falta configurar</h1><p class="muted">Preencha SB_URL e SB_KEY no topo do script do admin.html.</p></div>

<div id="login" hidden><div class="box">
  <h1>Painel Prime Edits</h1><p class="muted">Acesso restrito ao administrador.</p>
  <label>E-mail<input id="le" type="email" autocomplete="email"></label>
  <label>Senha<input id="lp" type="password" autocomplete="current-password"></label>
  <p class="msg e" id="lm"></p><button class="btn" id="lg" style="width:100%;padding:.75rem">Entrar</button>
</div></div>

<div id="app" hidden>
<header><div class="wrap bar"><b>Painel Prime Edits</b><small id="who"></small><button class="btn d s" id="out">Sair</button></div></header>
<main class="wrap">
  <nav id="tabs"><button data-t="orders" class="on">Pedidos<i id="pc" hidden></i></button><button data-t="clients">Clientes</button><button data-t="reviews">Avaliações</button><button data-t="products">Serviços</button><button data-t="settings">Configurações</button></nav>
  <section id="orders"></section>
  <section id="clients" hidden></section>
  <section id="reviews" hidden></section>
  <section id="products" hidden></section>
  <section id="settings" hidden></section>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script>
/* Cole aqui os MESMOS valores que você colocou na variável SB do seu site (URL e chave "anon public"). */
var SB_URL="https://rtzuivirevdothcbteiu.supabase.co", SB_KEY="sb_publishable_osaD5LfzjDZtI8xjCX9T1A_4kCMPOxp";

/* Serviços do site: [id, nome, preço, descrição curta] */
var BASE=[[1,"Edição básica",69.99,"Cortes, trilha e correção de áudio. Até 10 min."],[2,"Edição completa",99.99,"Legendas, motion, efeitos e color grading. Até 10 min."],[3,"Pacote 4 vídeos",350,"Quatro edições completas com preço de pacote."],[4,"Corte único",35,"Um vídeo vertical com legenda animada."],[5,"Pacote 10 cortes",145,"Dez vídeos verticais prontos para postar."],[6,"Pacote 30 cortes",420,"Trinta vídeos verticais com legendas e trilha."],[7,"Vídeo institucional",450,"Apresentação da empresa com locução e identidade visual."],[8,"Comercial com motion",599.99,"Anúncio com animações, trilha e versões para redes."],[9,"Edição de vídeo 30 segundos",49,"Um vídeo de jogo editado, com 30 segundos."],[10,"Edição de 2 vídeos de 30 segundos",55.23,"Dois vídeos de jogo, de 30 segundos cada."],[11,"Vídeo de até 5 minutos",77.99,"Edição de um vídeo de jogo com até 5 minutos."],[12,"Criação de site básico",99.99,"Site simples, moderno e responsivo."],[13,"Site profissional",250,"Site completo com visual profissional e a identidade da sua marca."],[15,"Aplicativo funcional do seu jeito",550,"Aplicativo personalizado, com a sua identidade e as funcionalidades que o seu negócio precisa."],[16,"NIK EXTERNAL SEMANAL",35,"Acesso semanal ao NIK EXTERNAL completo para FiveM."],[17,"NIK EXTERNAL MENSAL",45,"Acesso mensal ao NIK EXTERNAL completo para FiveM."],[18,"NIK EXTERNAL TRIMENSAL",99.99,"Acesso trimestral ao NIK EXTERNAL completo para FiveM."],[19,"NIK EXTERNAL LIFETIME",151.01,"Acesso vitalício ao NIK EXTERNAL completo para FiveM."],[14,"Site master",399.99,"O site mais completo, com recursos avançados."]];

var $=function(i){return document.getElementById(i)};
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function brl(v){return "R$ "+Number(v||0).toFixed(2).replace(".",",")}
function fdt(t){try{return new Date(t).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}catch(e){return ""}}
var ST={pending:"Aguardando",paid:"Pago",rejected:"Recusado"};
var db=null,ORD=[],OF="pending";

if(!SB_URL||!SB_KEY){$("cfg").hidden=false}
else{db=supabase.createClient(SB_URL,SB_KEY);
  db.auth.getSession().then(function(r){r.data.session?enter(r.data.session.user):($("login").hidden=false)})}

$("lg").onclick=function(){var b=this;b.disabled=true;$("lm").textContent="";
  db.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value}).then(function(r){b.disabled=false;
    if(r.error)return $("lm").textContent="E-mail ou senha incorretos.";enter(r.data.user)})};
$("lp").addEventListener("keydown",function(e){if(e.key=="Enter")$("lg").click()});
$("out").onclick=function(){db.auth.signOut().then(function(){location.reload()})};

/* Só entra quem está na tabela "admins" (o banco também bloqueia por RLS) */
function enter(u){db.from("admins").select("email").then(function(r){
  if(r.error||!r.data||!r.data.length){db.auth.signOut();$("login").hidden=false;$("lm").textContent="Esta conta não tem acesso ao painel.";return}
  $("login").hidden=true;$("app").hidden=false;$("who").textContent=u.email;loadOrders();loadClients();loadReviews();setInterval(loadOrders,20000);loadProducts();loadSettings()})}

$("tabs").onclick=function(e){var t=e.target.closest("button[data-t]");if(!t)return;
  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b==t)});
  ["orders","clients","reviews","products","settings"].forEach(function(s){$(s).hidden=s!=t.dataset.t})};

/* ===== Pedidos ===== */
function loadOrders(){db.from("orders").select("*").order("created_at",{ascending:false}).then(function(r){ORD=r.data||[];drawOrders()})}
function drawOrders(){
  var pend=ORD.filter(function(o){return o.status=="pending"}),paid=ORD.filter(function(o){return o.status=="paid"});
  var sum=paid.reduce(function(a,o){return a+Number(o.total)},0),mon=new Date().getMonth(),
      mes=paid.filter(function(o){return new Date(o.created_at).getMonth()==mon}).reduce(function(a,o){return a+Number(o.total)},0);
  $("pc").hidden=!pend.length;$("pc").textContent=pend.length;
  var list=ORD.filter(function(o){return OF=="all"||o.status==OF});
  $("orders").innerHTML='<div class="stats"><div class="st"><small>Aguardando</small><b>'+pend.length+'</b></div><div class="st"><small>Pedidos pagos</small><b>'+paid.length+'</b></div><div class="st"><small>Faturamento total</small><b>'+brl(sum)+'</b></div><div class="st"><small>Neste mês</small><b>'+brl(mes)+'</b></div></div>'
  +'<div class="row" style="margin-bottom:.8rem"><label style="margin:0;max-width:220px">Mostrar<select id="of">'+[["pending","Aguardando"],["paid","Pagos"],["rejected","Recusados"],["all","Todos"]].map(function(x){return '<option value="'+x[0]+'"'+(x[0]==OF?" selected":"")+'>'+x[1]+'</option>'}).join("")+'</select></label><button class="btn d s" id="ref">Atualizar</button></div>'
  +(list.length?list.map(function(o){var ph=String(o.phone||"").replace(/\D/g,"");
    return '<div class="card"><div class="row"><b>#'+o.id+' · '+esc(o.name||"—")+'</b><span class="tag '+o.status+'">'+ST[o.status]+'</span></div><div class="muted">'+fdt(o.created_at)+' · '+esc(o.email)+' · '+esc(o.phone||"")+'</div><div style="margin:.6rem 0">'
    +(o.items||[]).map(function(i){return '<div class="it"><span>'+i.q+'x '+esc(i.n)+'</span><span>'+brl(i.p*i.q)+'</span></div>'}).join("")+'</div><div class="row"><b style="color:var(--y)">Total '+brl(o.total)+'</b></div><div class="acts">'
    +(o.status=="pending"?'<span class="muted" style="width:100%">Ao confirmar, esta pessoa ganha o cargo CLIENTE e pode avaliar.</span>':'')
    +(o.status!="paid"?'<button class="btn" data-os="paid" data-id="'+o.id+'">✔ CONFIRMAR</button>':'')
    +(o.status!="rejected"?'<button class="btn r" data-os="rejected" data-id="'+o.id+'">✖ RECUSAR</button>':'')
    +(o.status!="pending"?'<button class="btn d s" data-os="pending" data-id="'+o.id+'">Voltar p/ aguardando</button>':'')
    +(ph?'<a class="btn d s" target="_blank" rel="noopener" href="https://wa.me/55'+ph.replace(/^55/,"")+'">WhatsApp</a>':'')
    +'<button class="btn r s" data-od="'+o.id+'">Excluir</button></div></div>'}).join(""):'<p class="muted">Nenhum pedido aqui.</p>');
  $("of").onchange=function(){OF=this.value;drawOrders()};$("ref").onclick=loadOrders}
$("orders").onclick=function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.os)db.from("orders").update({status:b.dataset.os}).eq("id",b.dataset.id).then(function(r){if(r.error)alert("Erro: "+r.error.message);loadOrders();loadClients()});
  if(b.dataset.od&&confirm("Excluir este pedido para sempre?"))db.from("orders").delete().eq("id",b.dataset.od).then(loadOrders)};

/* ===== Clientes (cargo CLIENTE = pode avaliar) ===== */
function loadClients(){db.from("clientes").select("*").order("since",{ascending:false}).then(function(r){var L=r.data||[];
  $("clients").innerHTML='<p class="muted">Quem tem o cargo CLIENTE pode publicar avaliação no site. O cargo é dado ao confirmar um pedido.</p>'+(r.error?'<p class="msg e">Rode o arquivo atualizacao.sql no Supabase.</p>':L.length?L.map(function(x){return '<div class="card"><div class="row"><b>'+esc(x.name||"—")+' <span class="tag paid">CLIENTE</span></b><span class="muted">desde '+fdt(x.since)+'</span></div><div class="muted">'+esc(x.email)+'</div><div class="acts"><button class="btn r s" data-rc="'+x.user_id+'">Remover cargo</button></div></div>'}).join(""):'<p class="muted">Nenhum cliente confirmado ainda.</p>')})}
$("clients").onclick=function(e){var b=e.target.closest("[data-rc]");if(b&&confirm("Remover o cargo de cliente? A pessoa não poderá mais avaliar."))db.from("clientes").delete().eq("user_id",b.dataset.rc).then(loadClients)};

/* ===== Avaliações ===== */
function loadReviews(){db.from("reviews").select("*").order("created_at",{ascending:false}).then(function(r){var L=r.data||[];
  $("reviews").innerHTML=L.length?L.map(function(x){return '<div class="card"><div class="row"><span class="stars">'+"★".repeat(x.stars)+'<span style="color:#3a3a3a">'+"★".repeat(5-x.stars)+'</span></span><span class="muted">'+esc(x.name)+' · '+fdt(x.created_at)+'</span></div><p style="margin:.5rem 0">'+esc(x.text)+'</p><button class="btn r s" data-rd="'+x.id+'">Excluir avaliação</button></div>'}).join(""):'<p class="muted">Nenhuma avaliação ainda.</p>'})}
$("reviews").onclick=function(e){var b=e.target.closest("[data-rd]");if(b&&confirm("Excluir esta avaliação?"))db.from("reviews").delete().eq("id",b.dataset.rd).then(loadReviews)};

/* ===== Serviços ===== */
function loadProducts(){db.from("products").select("*").then(function(r){var m={};(r.data||[]).forEach(function(x){m[x.id]=x});
  $("products").innerHTML='<p class="muted">Edite nome, preço e descrição. Desmarque “Ativo” para esconder o serviço do site.</p>'+BASE.map(function(b){var x=m[b[0]]||{};
  var on=x.active!==false;return '<div class="card" data-pid="'+b[0]+'"><div class="g2"><label>Nome<input data-f="name" value="'+esc(x.name||b[1])+'"></label><label>Preço (R$)<input data-f="price" type="number" step="0.01" min="0" value="'+(x.price!=null?x.price:b[2])+'"></label></div><label>Descrição curta (card)<input data-f="short" value="'+esc(x.short||b[3])+'"></label><label>Descrição completa (opcional, substitui a do site)<textarea data-f="full" rows="3">'+esc(x.full||"")+'</textarea></label><div class="row"><label class="chk" style="margin:0"><input type="checkbox" data-f="active"'+(on?" checked":"")+'>Ativo no site</label><span><span class="msg"></span> <button class="btn s" data-sp>Salvar</button></span></div></div>'}).join("")})}
$("products").onclick=function(e){var b=e.target.closest("[data-sp]");if(!b)return;var c=b.closest(".card"),g=function(f){return c.querySelector('[data-f="'+f+'"]')},m=c.querySelector(".msg");
  var row={id:+c.dataset.pid,name:g("name").value.trim(),price:+g("price").value,short:g("short").value.trim(),full:g("full").value.trim()||null,active:g("active").checked};
  b.disabled=true;db.from("products").upsert(row).then(function(r){b.disabled=false;m.className="msg"+(r.error?" e":"");m.textContent=r.error?"Erro ao salvar":"Salvo ✓";setTimeout(function(){m.textContent=""},2500)})};

/* ===== Configurações ===== */
var CF=[["pix_key","Chave PIX","SUA CHAVE PIX"],["pix_name","Nome do recebedor PIX (sem acento, até 25 letras)",""],["pix_city","Cidade do PIX (até 15 letras)",""],["whatsapp","WhatsApp com DDI e DDD (só números)","5541995403405"],["discord","Link do Discord","https://discord.gg/..."],["hero_sub","Frase abaixo do logo na página inicial",""]];
function loadSettings(){db.from("settings").select("*").then(function(r){var c={};(r.data||[]).forEach(function(x){c[x.key]=x.value});
  $("settings").innerHTML='<div class="card"><p class="muted" style="margin-top:0">Campos em branco continuam usando o valor que já está no site.</p>'+CF.map(function(f){return '<label>'+f[1]+'<input data-k="'+f[0]+'" placeholder="'+esc(f[2])+'" value="'+esc(c[f[0]]||"")+'"></label>'}).join("")+'<span class="msg" id="sm"></span> <button class="btn" id="ss">Salvar configurações</button></div>'})}
$("settings").onclick=function(e){if(e.target.id!="ss")return;var rows=[],del=[];
  document.querySelectorAll("[data-k]").forEach(function(i){var v=i.value.trim();v?rows.push({key:i.dataset.k,value:v}):del.push(i.dataset.k)});
  Promise.all([db.from("settings").upsert(rows),del.length?db.from("settings").delete().in("key",del):null]).then(function(r){var er=r[0].error;
    $("sm").className="msg"+(er?" e":"");$("sm").textContent=er?"Erro ao salvar":"Salvo ✓";setTimeout(function(){$("sm").textContent=""},2500)})};
</script>
</body>
</html>
